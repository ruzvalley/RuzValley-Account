<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d32">
  <meta name="description" content="Ruz Valley Restaurant Accounts">
  <title>Ruz Valley Accounts</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f3;
      color: #173d32;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
      background: white;
      border-radius: 22px;
      padding: 34px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 26px;
    }

    p {
      color: #58665f;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    a {
      display: block;
      padding: 15px 18px;
      border-radius: 12px;
      color: white;
      background: #173d32;
      text-decoration: none;
      font-weight: 700;
    }

    button.notify-btn {
      width: 100%;
      margin-top: 12px;
      padding: 13px 18px;
      border-radius: 12px;
      border: 1.5px solid #173d32;
      color: #173d32;
      background: #eef4f1;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    button.notify-btn:disabled {
      opacity: 0.75;
      cursor: default;
    }

    .note {
      font-size: 12px;
      margin-top: 18px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main>
    <img src="./icons/icon-192.png" alt="Ruz Valley">

    <h1>Ruz Valley Accounts</h1>

    <p>Restaurant Accounts Dashboard</p>

    <a href="https://script.google.com/macros/s/AKfycbyIuYkLguUh-ZBkEcFFrd0SakRZ2Mo6QqObWzfOqIuvwOzxsCiIxsV_Ea6UNvKi-_cc/exec">
      Open Accounts
    </a>

    <button type="button" id="enableAlertsBtn" class="notify-btn">
      🔔 Enable Today's Order Alerts
    </button>

    <p class="note">
      Internet connection is required to access your live accounts.
    </p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHPzV22QAopJCpwvwnsmiPEYSd6pRNamc",
      authDomain: "ruz-valley-pos.firebaseapp.com",
      projectId: "ruz-valley-pos",
      storageBucket: "ruz-valley-pos.firebasestorage.app",
      messagingSenderId: "1070715442602",
      appId: "1:1070715442602:web:d8087969200c8c7aee87d3"
    };

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIuYkLguUh-ZBkEcFFrd0SakRZ2Mo6QqObWzfOqIuvwOzxsCiIxsV_Ea6UNvKi-_cc/exec";
    const VAPID_KEY = "BJxgchIK3wqq51um-8x3cCOMQ0YL2rVTpVkNtQluiQVZV3FDTKrtNpOvfQqIyErdiyGZ8QQOMfnagO-sNdQa6jQ";

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);
    const btn = document.getElementById("enableAlertsBtn");

    async function syncPushToken(interactive = false) {
      if (!("Notification" in window) || !("serviceWorker" in navigator)) {
        btn.textContent = "Notifications not supported on this browser";
        btn.disabled = true;
        return;
      }

      let permission = Notification.permission;
      if (permission === "default" && interactive) {
        permission = await Notification.requestPermission();
      }

      if (permission !== "granted") {
        if (permission === "denied") {
          btn.textContent = "Alerts Blocked (Enable in Chrome Site Settings)";
        }
        return;
      }

      try {
        btn.textContent = "Connecting alerts...";
        const swReg = await navigator.serviceWorker.register("./firebase-messaging-sw.js", {
          scope: "./firebase-cloud-messaging-push-scope"
        });
        await navigator.serviceWorker.ready;

        const token = await getToken(messaging, {
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: swReg
        });

        if (token) {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "savePushToken", token })
          });
          btn.textContent = "✅ Today's Order Alerts Active";
          btn.disabled = true;
        }
      } catch (err) {
        console.error(err);
        btn.textContent = "⚠️ Tap to Retry Alert Setup";
      }
    }

    btn.addEventListener("click", () => syncPushToken(true));
    if (Notification.permission === "granted") {
      syncPushToken(false);
    }
  </script>
</body>
</html>
