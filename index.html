
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d32">
  <meta name="description" content="Ruz Valley Restaurant Accounts">
  <title>Ruz Valley Accounts</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f3;
      color: #173d32;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
      background: white;
      border-radius: 22px;
      padding: 34px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 26px;
    }

    p {
      color: #58665f;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    a {
      display: block;
      padding: 15px 18px;
      border-radius: 12px;
      color: white;
      background: #173d32;
      text-decoration: none;
      font-weight: 700;
    }

    .note {
      font-size: 12px;
      margin-top: 18px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main>
    <img src="./icons/icon-192.png" alt="Ruz Valley">

    <h1>Ruz Valley Accounts</h1>

    <p>Restaurant Accounts Dashboard</p>

    <a
      href="https://script.google.com/macros/s/AKfycbyIuYkLguUh-ZBkEcFFrd0SakRZ2Mo6QqObWzfOqIuvwOzxsCiIxsV_Ea6UNvKi-_cc/exec"
      target="_blank"
      rel="noopener">
      Open Accounts
    </a>

    <p class="note">
      Internet connection is required to access your live accounts.
    </p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
